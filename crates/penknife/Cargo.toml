[package]
name = "penknife"
description = "Git-style remotes for your documents: sync a folder of markdown to GitHub Gists, track drift per file, and copy anything as rich text to paste elsewhere"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["tui", "markdown", "gist", "notes", "sync"]
categories = ["command-line-utilities", "text-processing"]

# rust-ci's release.yml ships assets as `penknife-{os}-{arch}.{ext}` (no
# version, no full target triple), which matches none of cargo-binstall's
# default guess templates, so `cargo binstall penknife` silently fell back
# to compiling from source. archive-suffix resolves against every extension
# binstall knows for the given pkg-fmt (both .tgz and .tar.gz for Tgz), so
# this matches the actual .tar.gz assets without hardcoding it.
#
# { name } (crate name), not { bin }: binstall only resolves { bin } later,
# in bin-dir, after a specific binary is known - it isn't available when
# pkg-url renders (confirmed the hard way on edikt 0.2.7). { name } happens
# to equal the binary name here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ os-name }-{ target-arch }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
penknife-gist = { path = "../penknife-gist", version = "0.2.1" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
tui-tree-widget = "0.24"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dirs = "6"
hex = "0.4"
sha2 = "0.11"
similar = "3"
arboard = "3"
htmd = "0.5"
pulldown-cmark = "0.13"
open = "5"
nucleo-matcher = "0.3"
trash = "5"
toml = "1.1"
globset = "0.4"
unicode-width = "0.2"
chrono = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
color-eyre = "0.6.5"

[dev-dependencies]
tempfile = "3"
wiremock = { workspace = true }
